[package]
name = "scribe"
version = "0.6.0"
edition = "2021"
description = "Disk scan + heatmap + select-to-backup TUI with a pluggable simulation hook"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
walkdir = "2"
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[profile.release]
opt-level = 2
