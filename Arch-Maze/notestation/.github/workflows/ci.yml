name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: scribe (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scribe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scribe
      - name: format
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --release -- -D warnings
      - name: build
        run: cargo build --release
      - name: test
        run: cargo test --release

  python:
    name: dial + sealgate (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compile
        run: python -m py_compile dial/dial.py sealgate/sealgate.py
      - name: smoke tests
        run: bash tests/smoke.sh
